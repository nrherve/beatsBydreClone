<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>beatsBydre</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="assets/imgi_2_beats-logo-161616.png" alt="The beats logo" class="logo">
    <nav class="navigationLink">
      <a>Shop</a>
      <a>GiftGuide</a>
      <a>Support</a>
    </nav>
    <nav class="search">
      <a><img src="assets/loupe.png" class="searchItem"></a>
      <a><img src="assets/parcel.png" class="searchItem"></a>
    </nav>
  </header>
  <section class="hero">
    <img src="assets/imgi_3_hp-hero-beats-360-kendall.jpg.large.2x.jpg">
    <section class="hero-content">
      <p class="name">Kendall Jenner</p>
      <p class="company">Beats 360</p>
      <p class="tagline">One headphone, Every version of you</p>
      <article class="heroButton">
        <button class="btnShop">Shop Now</button>
        <button class="btnCustomize">Customize</button>
      </article>
    </section>
  </section>
  <section class="about">
    <h1>Kendall Favorites</h1>
    <article class="headphones1">
      <div class="content">
        <p class="time">New</p>
        <p class="name">Beats 360</p>
        <p class="price">$349.99</p>
      </div>
      <img src="assets/imgi_4_plp-beats360-cloud.jpg">
    </article>
    <article class="headphones2">
      <div class="content">
        <p class="time">New</p>
        <p class="name">Beats 360 Cushon Kits - Performance Knit</p>
        <p class="price">$349.99</p>
      </div>
      <img src="assets/imgi_5_plp-360-performance-kit-pink.jpg">
      
    </article>
    <article class="headphones3">
      <div class="content">
        <p class="time">New</p>
        <p class="name">Beats 360 Cushon Kits - Performance Knit</p>
        <p class="price">$349.99</p>
      </div>
      <img src="assets/imgi_6_plp-360-performance-kit-sky.jpg">
    </article>
  </section>
</body>
</html>
